openapi: 3.1.0
info:
  title: Oracle AI World 2026 Agenda Assistant
  version: 0.1.1
  description: >-
    Search a sanitized snapshot of the Oracle AI World 2026 session catalog, inspect sessions,
    detect schedule conflicts, and create a heuristic agenda. Snapshot data can become stale;
    users should verify critical details in the official Oracle catalog. This is an unofficial
    community tool and is not affiliated with or endorsed by Oracle.
servers:
  - url: https://ai-world-agenda-plugin.onrender.com
    description: Production API hosted on Render.
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Check whether the agenda API is running.
      responses:
        '200':
          description: API health
  /catalog/meta:
    get:
      operationId: getCatalogMetadata
      summary: Get snapshot import metadata and freshness warning.
      responses:
        '200':
          description: Catalog metadata
  /sessions:
    get:
      operationId: getSessionsByDay
      summary: List/filter AI World sessions.
      description: Use this for simple filters such as date, time window, keyword, content area, or area of interest.
      parameters:
        - {name: date, in: query, schema: {type: string, format: date}}
        - {name: from, in: query, schema: {type: string, example: '09:00'}}
        - {name: to, in: query, schema: {type: string, example: '17:00'}}
        - {name: keyword, in: query, schema: {type: string}}
        - {name: contentArea, in: query, schema: {type: string}}
        - {name: areaOfInterest, in: query, schema: {type: string}}
        - {name: sessionType, in: query, schema: {type: string}}
        - {name: industry, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 50, maximum: 200}}
      responses:
        '200': {description: Matching sessions}
  /sessions/code/{code}:
    get:
      operationId: getSessionByCode
      summary: Retrieve one session by catalog code, for example LRN2141.
      parameters:
        - name: code
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: Session}
        '404': {description: Session not found}
  /sessions/search:
    post:
      operationId: searchSessions
      summary: Search sessions by text plus optional date/time filters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query: {type: string}
                date: {type: string, format: date}
                from: {type: string}
                to: {type: string}
                contentArea: {type: string}
                areaOfInterest: {type: string}
                sessionType: {type: string}
                industry: {type: string}
                limit: {type: integer, default: 50}
      responses:
        '200': {description: Ranked matching sessions}
  /sessions/conflicts:
    post:
      operationId: findSessionConflicts
      summary: Check whether selected session codes overlap or violate transition time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codes]
              properties:
                codes:
                  type: array
                  items: {type: string}
                minimumTransitionMinutes: {type: integer, default: 0}
      responses:
        '200': {description: Conflict report}
  /sessions/route:
    post:
      operationId: getWalkRoute
      summary: Step-by-step walking route between two places at the Venetian Expo, with schematic floor plan URLs (estimates).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: {type: string, description: "Free text such as 'Hall G', 'Titian' or 'Hub'"}
                to: {type: string}
      responses:
        '200': {description: Route with steps, levels, distance and mapUrls (SVG per level)}
        '404': {description: Place not found or no route}
  /venue/route:
    get:
      operationId: getRouteMap
      summary: SVG floor plan of one level with the walking route drawn on it.
      parameters:
        - {name: from, in: query, required: true, schema: {type: string}}
        - {name: to, in: query, required: true, schema: {type: string}}
        - {name: level, in: query, required: false, schema: {type: integer}}
      responses:
        '200': {description: SVG image}
        '404': {description: No route}
  /venue/route.png:
    get:
      operationId: getRouteMapPng
      summary: PNG floor plan of one level with the walking route drawn on it (use this one to display the map).
      parameters:
        - {name: from, in: query, required: true, schema: {type: string}}
        - {name: to, in: query, required: true, schema: {type: string}}
        - {name: level, in: query, required: false, schema: {type: integer}}
      responses:
        '200': {description: PNG image}
        '404': {description: No route}
  /agenda/plan:
    post:
      operationId: planStrictDay
      summary: Plan one day with no overlaps, a limit on lateness, a lunch block and networking blocks.
      description: >-
        Picks the best-scoring set of sessions for the topics where every move can be walked within the
        lateness limit (worst-case walking time by default). Walking times are estimates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, topics]
              properties:
                date: {type: string, format: date}
                topics:
                  type: array
                  items: {type: string}
                rules:
                  type: object
                  properties:
                    lateToleranceMinutes: {type: integer, default: 2}
                    latenessBasis: {type: string, enum: [worst, best], default: worst}
                    includeHubTalks: {type: boolean, default: true}
                    includeKeynote: {type: boolean, default: false}
                    lunchMinutes: {type: integer, default: 30}
                    lunchWindow: {type: array, items: {type: string}, example: ["12:00", "14:00"]}
                    networkingBlocks: {type: integer, default: 2}
                    networkingMinutes: {type: integer, default: 20}
                    networkingWindow: {type: array, items: {type: string}, example: ["11:00", "18:00"]}
                    dayStart: {type: string, default: "08:00"}
                    dayEnd: {type: string, default: "18:00"}
                fixedCommitments:
                  type: array
                  items:
                    type: object
                    properties:
                      title: {type: string}
                      startTime: {type: string}
                      endTime: {type: string}
      responses:
        '200': {description: Schedule, moves, dropped sessions and warnings}
  /agenda/optimize:
    post:
      operationId: optimizeAgenda
      summary: Create a heuristic one-day agenda from interests and fixed commitments.
      description: >-
        Use this to propose a candidate agenda. The client/LLM should still consider venue logistics,
        meals, networking, speaking obligations, and user judgment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: {type: string, format: date}
                interests:
                  type: array
                  items: {type: string}
                preferences:
                  type: object
                  properties:
                    topics:
                      type: array
                      items: {type: string}
                    minimumTransitionMinutes: {type: integer, default: 10}
                fixedCommitments:
                  type: array
                  items:
                    type: object
                    required: [title, startTime, endTime]
                    properties:
                      title: {type: string}
                      date: {type: string, format: date}
                      startTime: {type: string}
                      endTime: {type: string}
      responses:
        '200': {description: Candidate agenda with alternatives}
